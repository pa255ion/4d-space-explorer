<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4D Space Explorer</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #05070b; color: #9fb0c0; font: 14px/1.5 ui-monospace, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  canvas { display: block; width: min(100vw, calc((100vh - 64px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; cursor: crosshair; }
  #status { position: fixed; top: 40%; left: 0; right: 0; text-align: center; font-size: 16px; padding: 0 16px; }
  #status.error { color: #ff6a55; }
  .hidden { display: none; }
  footer { padding: 0 16px; text-align: center; }
  a { color: #6ec8ff; }
</style>
</head>
<body>
<canvas id="view" width="1280" height="720"></canvas>
<div id="status">Starting…</div>
<footer>
  Click to fly · WASD/Space/Z move · R/F ana/kata · mouse turns · V/B views · C walk the room · ` options and all controls ·
  <a href="https://github.com/pa255ion/4d-space-explorer">source</a>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
